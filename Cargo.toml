[package]
name = "pretty_table_rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Typed, Unicode-aware tables inspired by Python PrettyTable"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/younisshah/pretty_table"
keywords = ["table", "terminal", "unicode", "formatting"]
categories = ["command-line-interface", "text-processing"]
exclude = ["upstream/", "target/", ".superpowers/"]

[features]
default = ["csv", "html"]
csv = ["dep:csv"]
html = ["dep:scraper"]

[dependencies]
unicode-width = "0.2.2"
unicode-segmentation = "1.12"
serde_json = { version = "1", features = ["arbitrary_precision"] }
csv = { version = "1.4", optional = true }
scraper = { version = "0.24", default-features = false, optional = true }

[workspace]

